[project]
name = "wheat-app"
version = "0.1.0"
description = "麦田-目标规划助手"
readme = "README.md"
authors = [
    { name = "fishkylin", email = "fishkylin@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wheat-app = "wheat_app.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

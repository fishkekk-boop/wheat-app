[project]
name = "wheat-app"
version = "0.1.0"
description = "麦田-目标规划助手"
readme = "README.md"
authors = [
    { name = "fishkylin", email = "fishkylin@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
wheat-app = "wheat_app.main:run"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"      # 这样写测试不用每个都加 @pytest.mark.asyncio
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
